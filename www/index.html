<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ToolKit Manager</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>
<button class="bar-handle" id="barHandle" type="button" aria-label="Mở thanh menu" aria-expanded="false"><span></span></button>
<div class="bar-scrim" id="barScrim" hidden></div>
<div class="bar" id="bar" role="tablist">
  <img class="logo" src="assets/logo-192.png" alt="" width="28" height="28">
  <h1>ToolKit Manager</h1>
  <button class="tab" role="tab" id="t-scan" aria-selected="true">Scan tài liệu</button>
  <button class="tab" role="tab" id="t-c3d" aria-selected="false">Container 3D</button>
  <span class="sp"></span>
  <span class="ver" id="ver" title="Phiên bản"></span>
  <button class="th" id="theme" type="button">Giao diện: Sáng</button>
</div>
<div class="home" id="home" hidden>
  <div class="home-in">
    <img class="home-logo" src="assets/logo.png" alt="" width="96" height="96">
    <h1>ToolKit Manager</h1>
    <p class="home-sub">Chọn công cụ để bắt đầu</p>
    <button class="home-card" id="h-scan" type="button">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      <span><b>Scan tài liệu</b><small>Chụp / chọn ảnh hoặc PDF → cắt trang, khử bóng → lưu PDF</small></span>
    </button>
    <button class="home-card" id="h-c3d" type="button">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      <span><b>Container 3D</b><small>Xếp hàng vào container, xuất Excel / ảnh 3D</small></span>
    </button>
    <div class="home-foot"><span class="ver" id="ver2"></span><button class="th" id="theme2" type="button">Giao diện: Sáng</button></div>
  </div>
</div>
<div class="stage" id="stage"><div class="load" id="load">Đang tải…</div></div>
<div class="upd" id="upd" hidden role="status"></div>

<script src="js/update-config.js" charset="utf-8"></script>
<script src="shared/js/native-bridge.js" charset="utf-8"></script>
<script src="js/shell.js" charset="utf-8"></script>
<script src="js/updater.js" charset="utf-8"></script>
</body>
</html>
